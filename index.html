<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Favorite Singers</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-5">Favorite Singers</h1>

      <div class="row">
        <!-- First column: Image -->
        <div class="col-sm-4">
          <img src="music.jpg" class="img-fluid" alt="Music Image" />
        </div>

        <!-- Second column: Table -->
        <div class="col-sm-8">
          <table class="table table-striped">
            <thead>
              <tr>
                <th>Singer</th>
                <th>Date of Birth</th>
                <th>Best Songs</th>
              </tr>
            </thead>

            <tbody id="singerTable"></tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="js folder/main.js"></script>
  </body>
</html>
